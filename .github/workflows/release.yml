name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build release archive
        run: |
          # 打包插件源码（排除 .git 与 .github 工作流）
          tar -czf dsh-telegram-bridge.tar.gz --exclude='.git' --exclude='.github' .
          echo "archive created:"; ls -l dsh-telegram-bridge.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dsh-telegram-bridge.tar.gz
